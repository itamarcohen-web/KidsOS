<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus access control for org.kidsos.Auth1. Method-level authorization
  (first-boot-only for account creation, polkit for everything else
  post-first-boot) happens inside AuthService itself — see
  docs/SECURITY_ARCHITECTURE.md. This file only controls who may own the
  bus name and send it messages at all.
-->
<busconfig>
  <policy user="root">
    <allow own="org.kidsos.Auth1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.kidsos.Auth1"/>
    <allow receive_sender="org.kidsos.Auth1"/>
  </policy>
</busconfig>
