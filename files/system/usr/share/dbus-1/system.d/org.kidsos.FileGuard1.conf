<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Deliberately the tightest policy of the four services: FileGuardService
  performs no caller check of its own (see
  core/services/kidsos-file-guard/FileGuardService.h), so this file IS
  the enforcement — only root (i.e. kidsos-installer, which is what
  computes and re-validates the hash before ever calling TrustFile) may
  reach this interface at all. No child-facing process should ever hold
  a live connection able to call TrustFile directly.
-->
<busconfig>
  <policy user="root">
    <allow own="org.kidsos.FileGuard1"/>
    <allow send_destination="org.kidsos.FileGuard1"/>
    <allow receive_sender="org.kidsos.FileGuard1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.kidsos.FileGuard1"/>
  </policy>
</busconfig>
