<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="kidsos-service">
    <allow own="org.kidsos.Safety1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.kidsos.Safety1"/>
    <allow receive_sender="org.kidsos.Safety1"/>
  </policy>
</busconfig>
