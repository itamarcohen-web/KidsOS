# One-time autologin into the kidsos-setup session, which runs only
# kidsos-onboarding (the Parent/Child account-creation wizard). Removed
# by AuthService::MarkFirstBootComplete() once setup finishes — see
# docs/ACCOUNTS_AND_LOGIN.md. If this file is missing, SDDM shows the
# normal KidsOS login screen instead (branding/sddm-theme/kidsos/).
[Autologin]
User=kidsos-setup
Session=kidsos-setup.desktop
Relogin=false
