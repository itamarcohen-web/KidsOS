[Theme]
Current=kidsos

[General]
# Lets the KidsOS SDDM theme (branding/sddm-theme/kidsos/) import the
# same KidsOS.Theme/KidsOS.Localization/KidsOS.Common QML modules every
# other KidsOS app uses, instead of duplicating design tokens/components
# for the login screen — see docs/DESIGN_SYSTEM.md.
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/kidsos/qml,QT_QUICK_CONTROLS_STYLE=Basic

[Users]
# Don't show system/service accounts (kidsos-setup, kidsos-service) on
# the KidsOS login screen — only real Parent/Child accounts.
HideUsers=kidsos-setup,kidsos-service
MinimumUid=1000
