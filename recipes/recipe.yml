# KidsOS BlueBuild recipe.
#
# Produces a Fedora Kinoite (KDE Plasma) based OCI image with the KidsOS
# apps, branding, family account/permission system, and first-boot
# experience baked in. Build with the official BlueBuild CLI or GitHub
# Action — see docs/BUILD.md for exact commands.
#
# IMPORTANT: BlueBuild's `files` and `script` modules both require every
# referenced path to live under a literal top-level `files/` directory
# at the repo root (mounted into the build container at $CONFIG_DIRECTORY,
# e.g. /tmp/files) — there is no way to reference repo-root-relative
# paths directly. That's why the actual KidsOS source (apps/, core/,
# branding/, CMakeLists.txt), the rootfs overlay (files/system/), and
# the build script (files/scripts/) all live under files/ instead of at
# the repo root. See docs/BUILD.md for the full explanation.
name: kidsos
description: >-
  KidsOS — a colorful, friendly operating system for kids and teens,
  built on Fedora Kinoite and KDE Plasma, with a real Parent/Child
  account and permission system.
base-image: quay.io/fedora-ostree-desktops/kinoite
# Bump this to the current stable Fedora release before building —
# https://fedoraproject.org/releases/
image-version: "41"

modules:
  # ---- Deploy the rootfs overlay: systemd units, desktop entries,
  #      autostart glue, session wrapper, SDDM/xsession config, polkit
  #      actions, D-Bus policy, fapolicyd rules — everything under
  #      files/system/ maps 1:1 onto the final image's / ----
  - type: files
    files:
      - source: system
        destination: /

  # ---- Compile the KidsOS apps + kidsos-* services (source at
  #      files/apps, files/core, files/branding, files/CMakeLists.txt —
  #      all reachable from the script at $CONFIG_DIRECTORY, i.e.
  #      /tmp/files), install branding/fonts/SDDM theme, provision
  #      users/dirs. See files/scripts/build-kidsos-apps.sh. ----
  - type: script
    scripts:
      - build-kidsos-apps.sh

  # ---- Runtime packages ----
  - type: rpm-ostree
    install:
      - dolphin # underlies Kids Files
      - kate # underlies Kids Writer
      - kcalc # Calculator
      - spectacle # Screenshot
      - gwenview # Photos
      - haruna # Video
      - qt6-qtsvg # renders branding/*.svg (icons, wallpaper) at runtime
      - fapolicyd # external-application execution allowlisting — docs/TRUST_MODEL.md
      - google-noto-sans-hebrew-fonts
      - google-noto-sans-arabic-fonts
      - google-noto-emoji-fonts
      - google-noto-color-emoji-fonts

  # ---- Browser + Music (via Flatpak): Elisa isn't packaged as an RPM
  #      past Fedora 29 in Fedora's repos, so Kids Music ships as the
  #      Flathub build instead ----
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - org.mozilla.firefox
          - org.kde.elisa

  # ---- Enable the KidsOS services + fapolicyd. Account creation is now
  #      always explicit through onboarding (kidsos-setup session) —
  #      see docs/ACCOUNTS_AND_LOGIN.md. ----
  - type: systemd
    system:
      enabled:
        - fapolicyd.service
        - kidsos-auth.service
        - kidsos-policy.service
        - kidsos-file-guard.service
        - kidsos-installer.service

  # ---- Sign the resulting image (see docs/BUILD.md for cosign setup) ----
  - type: signing
