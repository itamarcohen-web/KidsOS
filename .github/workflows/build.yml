# Builds and publishes the KidsOS image via BlueBuild's reusable workflow.
name: Build KidsOS image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    uses: blue-build/github-workflow-templates/.github/workflows/build.yml@main
    with:
      recipe: recipe.yml
      recipe_dir: recipes
    secrets:
      signing_secret: ${{ secrets.SIGNING_SECRET }}