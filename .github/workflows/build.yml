name: Build KidsOS image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build and push KidsOS image
        uses: blue-build/github-action@v1
        with:
          # Just the filename: the action itself looks for it under
          # ./recipes/ (or ./config/) — passing "recipes/recipe.yml" here
          # doubled the path to "./recipes/recipes/recipe.yml", which is
          # what actually failed every previous run once the signing
          # input-name bug (fixed above) stopped masking it.
          recipe: recipe.yml
          push: true
          registry_username: ${{ github.actor }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
          # The actual input name is `build_opts` — a previous version of
          # this workflow used the nonexistent `cli_args`, which was
          # silently ignored, so every build below tried (and failed) to
          # sign with no cosign key configured. `--no-sign` here is what
          # actually reaches the BlueBuild CLI and skips that step. See
          # docs/BUILD.md for how to switch to real signing later.
          build_opts: "--no-sign"

      - name: Log in to GHCR (for pulling the image back down to build the ISO)
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate installable ISO from the pushed image
        run: |
          mkdir -p iso-output
          # --output-dir/--iso-name belong to `generate-iso` itself, not to
          # the `image` subcommand, so they must come before it — clap
          # rejects them if they trail the subcommand (exit code 2: hit
          # this the first time this step ran).
          bluebuild generate-iso \
            --output-dir ./iso-output \
            --iso-name kidsos.iso \
            image "ghcr.io/${{ github.repository_owner }}/kidsos:latest"

      - name: Upload ISO as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidsos-iso
          path: iso-output/kidsos.iso
          retention-days: 14
          if-no-files-found: error
